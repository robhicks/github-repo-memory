[package]
name = "enterprise-code-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
# MCP SDK
rmcp = { version = "1.3", features = ["server", "macros", "transport-streamable-http-server"] }

# Graph database
falkordb = { version = "0.2", features = ["tokio"] }

# GitHub API
octocrab = "0.49"

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# OAuth 2
oauth2 = "5"
jsonwebtoken = "9"
dashmap = "6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Rate limiting
governor = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Manifest parsing
toml = "0.8"
regex = "1"

# HTTP client (for OAuth token exchange)
reqwest = { version = "0.12", features = ["json"] }

# URL encoding
urlencoding = "2"
